# Standalone measurement harness (NOT a workspace member): per-row Model::forward logits dump. No crates/ change.
[package]
name = "fwdrows"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
intarsia-cli = { path = "../../../../../crates/intarsia-cli", features = ["metal"] }
intarsia-core = { path = "../../../../../crates/intarsia-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

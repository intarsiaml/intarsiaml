# Standalone measurement harness (NOT a workspace member): repeated prefill requests in one process (warm, serving path
# Engine::generate with max_tokens 1), per-request wall prefill time and start/end on the GPU-trace clock.
[package]
name = "cbgap-bench"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
intarsia-cli = { path = "../../../../../crates/intarsia-cli", features = ["metal"] }
intarsia-core = { path = "../../../../../crates/intarsia-core" }
intarsia-backend-metal = { path = "../../../../../crates/intarsia-backend-metal" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

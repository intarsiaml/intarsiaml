# Recipe scaffold for lfm2_moe generated by `intarsia recipe new --model /Users/josef/.cache/huggingface/hub/models--LiquidAI--LFM2.5-24B-A2B-MLX-4bit/snapshots/667408d494bde191c2cb9dd4f4549827816b9275`.
# Every inferred field carries the source it came from; `TODO(recipe-new)` marks what could not be mapped and needs a decision.
# Closest existing recipe: builtin:qwen3_5.
[model]
match.architectures = ["Lfm2MoeForCausalLM"]    # from config.json architectures
family = "lfm2_moe"                             # from config.json model_type
chat_template = "hf"                            # default: the model's own jinja template (chat_template.jinja or tokenizer_config.json)
# reasoning_parser / tool_parser: optional, not inferable from the checkpoint (see an existing recipe of the same lineage)
# TODO(recipe-new): model.norm_offset: closest recipe builtin:qwen3_5 uses norm_offset = 1.0 (zero-centred RMSNorm) but this is a different family; the checkpoint does not say, check the model's RMSNorm in transformers (x * w vs x * (1 + w))
norm_offset = 1.0                               # placeholder copied from the closest recipe, verify

[layer]
# TODO(recipe-new): config.json: model error: config.json missing 'rms_norm_eps' (no default is assumed); the engine reads the dimensions with the Hugging Face key names, map different names in a [config] table (docs/adding-a-model.md)
# TODO(recipe-new): layer: layers 0 and 39 of type 'conv' have different tensors (only in 0: ["feed_forward.down_proj", "feed_forward.gate_proj", "feed_forward.up_proj"]; only in 39: ["feed_forward.expert_bias", "feed_forward.gate", "feed_forward.switch_mlp.down_proj"]); one pattern cannot describe both (dense-then-MoE or similar), split them by layer type
# TODO(recipe-new): layer: no attention or linear-attention block recognised (module groups in the layer: ["conv", "feed_forward"]); a new block or a different tensor layout is needed
# TODO(recipe-new): layer.ffn: type 'full_attention' names the ffn tensors differently from an earlier layer type (FfnT { parent: "feed_forward", gate: "feed_forward.gate_proj", up: "feed_forward.up_proj", down: "feed_forward.down_proj" } vs FfnT { parent: "feed_forward.switch_mlp", gate: "feed_forward.switch_mlp.gate_proj", up: "feed_forward.switch_mlp.up_proj", down: "feed_forward.switch_mlp.down_proj" }); one table cannot express both
# TODO(recipe-new): layer: no attention or linear-attention block recognised (module groups in the layer: ["feed_forward", "feed_forward.switch_mlp", "self_attn"]); a new block or a different tensor layout is needed
pattern = ["ffn"]                               # from tensors of layer 2 (type full_attention); used only for a layer without a type
pattern_by_layer = "layer_types"                # from text_config.layer_types

[layer.by_type]
conv = ["ffn"]                                  # from tensors of layer 0 (first layer of type conv)
full_attention = ["ffn"]                        # from tensors of layer 2 (first layer of type full_attention)

[layer.ffn]
kind = "dense"                                  # from tensors: gate_proj / up_proj / down_proj under model.layers.0.feed_forward
act = "silu_glu"                                # default: config has no hidden_act, silu assumed
gate = "model.layers.{i}.feed_forward.gate_proj"  # from tensors: model.layers.0.feed_forward.gate_proj.weight
up = "model.layers.{i}.feed_forward.up_proj"    # from tensors: model.layers.0.feed_forward.up_proj.weight
down = "model.layers.{i}.feed_forward.down_proj"  # from tensors: model.layers.0.feed_forward.down_proj.weight

[layer.norms]
pre_ffn = "model.layers.{i}.ffn_norm"           # from tensors: model.layers.0.ffn_norm.weight

[top]
embed = "model.embed_tokens"                    # from tensors: model.embed_tokens.weight
# TODO(recipe-new): top.final_norm: no final norm tensor (model.norm.weight or similar) in the checkpoint; name it
final_norm = "model.norm"                       # placeholder, tensor missing from the checkpoint
lm_head = { tensor = "lm_head", tied_to = "model.embed_tokens" }  # lm_head is absent from the checkpoint and text_config.tie_word_embeddings = true, so it is tied to the embedding table
# TODO(recipe-new): top: 1 checkpoint tensor(s) outside the layer stack are claimed by no block, e.g. ["model.embedding_norm.weight"]; decide whether the model needs them
# TODO(recipe-new): layer: 12 per-layer tensor(s) are claimed by no block, e.g. ["conv.conv.weight", "conv.in_proj.weight", "conv.out_proj.weight", "feed_forward.expert_bias", "feed_forward.gate.weight", "operator_norm.weight"] ... (relative to model.layers.<i>.); extra norms, biases or unknown modules need a block or an explicit decision to ignore them

[defaults]
kv_dtype = "bf16"                               # default: bf16 KV cache (fp8_e4m3 KV is accepted by the cpu oracle only)
max_batch = 1                                   # default; raise after measuring

# Ephemeral Prometheus for the ob lane: scrapes one engine, started by hand with docker run, removed after the check.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: intarsia
    metrics_path: /metrics
    static_configs:
      - targets: ["__TARGET__"]
        labels: { host: __HOST__ }

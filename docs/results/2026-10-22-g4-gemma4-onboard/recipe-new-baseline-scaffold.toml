# Recipe scaffold for gemma4 generated by `intarsia recipe new --model /private/tmp/claude-501/-opt-code-intarsiaml/f31ccf91-6032-412f-aeab-eea38852047d/scratchpad/g4/model`.
# Every inferred field carries the source it came from; `TODO(recipe-new)` marks what could not be mapped and needs a decision.
# Closest existing recipe: builtin:qwen3_5_vl.
[model]
match.architectures = ["Gemma4ForConditionalGeneration"]  # from config.json architectures
family = "gemma4"                               # from config.json model_type
chat_template = "hf"                            # default: the model's own jinja template (chat_template.jinja or tokenizer_config.json)
# reasoning_parser / tool_parser: optional, not inferable from the checkpoint (see an existing recipe of the same lineage)
# TODO(recipe-new): model.norm_offset: closest recipe builtin:qwen3_5_vl uses norm_offset = 1.0 (zero-centred RMSNorm) but this is a different family; the checkpoint does not say, check the model's RMSNorm in transformers (x * w vs x * (1 + w))
norm_offset = 1.0                               # placeholder copied from the closest recipe, verify

[layer]
# TODO(recipe-new): layer: sliding-window attention (text_config.sliding_window = 1024 (use_sliding_window absent, so it applies)) is not implemented, a new attention block kind is needed
# TODO(recipe-new): layer: sliding-window attention (text_config.layer_types contains sliding_attention) is not implemented, a new attention block kind is needed
# TODO(recipe-new): layer: no attention or linear-attention block recognised (module groups in the layer: ["experts.0", "experts.1", "experts.10", "experts.100", "experts.101", "experts.102", "experts.103", "experts.104", "experts.105", "experts.106", "experts.107", "experts.108", "experts.109", "experts.11", "experts.110", "experts.111", "experts.112", "experts.113", "experts.114", "experts.115", "experts.116", "experts.117", "experts.118", "experts.119", "experts.12", "experts.120", "experts.121", "experts.122", "experts.123", "experts.124", "experts.125", "experts.126", "experts.127", "experts.13", "experts.14", "experts.15", "experts.16", "experts.17", "experts.18", "experts.19", "experts.2", "experts.20", "experts.21", "experts.22", "experts.23", "experts.24", "experts.25", "experts.26", "experts.27", "experts.28", "experts.29", "experts.3", "experts.30", "experts.31", "experts.32", "experts.33", "experts.34", "experts.35", "experts.36", "experts.37", "experts.38", "experts.39", "experts.4", "experts.40", "experts.41", "experts.42", "experts.43", "experts.44", "experts.45", "experts.46", "experts.47", "experts.48", "experts.49", "experts.5", "experts.50", "experts.51", "experts.52", "experts.53", "experts.54", "experts.55", "experts.56", "experts.57", "experts.58", "experts.59", "experts.6", "experts.60", "experts.61", "experts.62", "experts.63", "experts.64", "experts.65", "experts.66", "experts.67", "experts.68", "experts.69", "experts.7", "experts.70", "experts.71", "experts.72", "experts.73", "experts.74", "experts.75", "experts.76", "experts.77", "experts.78", "experts.79", "experts.8", "experts.80", "experts.81", "experts.82", "experts.83", "experts.84", "experts.85", "experts.86", "experts.87", "experts.88", "experts.89", "experts.9", "experts.90", "experts.91", "experts.92", "experts.93", "experts.94", "experts.95", "experts.96", "experts.97", "experts.98", "experts.99", "mlp", "router", "self_attn"]); a new block or a different tensor layout is needed
pattern = ["ffn"]                               # from tensors of layer 5 (type full_attention); used only for a layer without a type
pattern_by_layer = "layer_types"                # from text_config.layer_types

[layer.by_type]
sliding_attention = ["attn", "ffn"]             # from tensors of layer 0 (first layer of type sliding_attention)
full_attention = ["ffn"]                        # from tensors of layer 5 (first layer of type full_attention)

[layer.attn]
kind = "gqa"                                    # from tensors: q/k/v/o_proj under model.language_model.layers.0.self_attn
q = "model.language_model.layers.{i}.self_attn.q_proj"  # from tensors: model.language_model.layers.0.self_attn.q_proj.weight
k = "model.language_model.layers.{i}.self_attn.k_proj"  # from tensors: model.language_model.layers.0.self_attn.k_proj.weight
v = "model.language_model.layers.{i}.self_attn.v_proj"  # from tensors: model.language_model.layers.0.self_attn.v_proj.weight
o = "model.language_model.layers.{i}.self_attn.o_proj"  # from tensors: model.language_model.layers.0.self_attn.o_proj.weight
q_norm = "model.language_model.layers.{i}.self_attn.q_norm"  # from tensors: model.language_model.layers.0.self_attn.q_norm.weight
k_norm = "model.language_model.layers.{i}.self_attn.k_norm"  # from tensors: model.language_model.layers.0.self_attn.k_norm.weight
rope = "default"                                # from text_config.rope_parameters (rope_type absent or "default")
gated = true                                    # from closest recipe builtin:qwen3_5_vl; no q_proj shape (no shard headers) and no attn_output_gate in the config, verify

[layer.ffn]
kind = "dense"                                  # from tensors: gate_proj / up_proj / down_proj under model.language_model.layers.0.experts.0
act = "silu_glu"                                # default: config has no hidden_act, silu assumed
gate = "model.language_model.layers.{i}.experts.0.gate_proj"  # from tensors: model.language_model.layers.0.experts.0.gate_proj.weight
up = "model.language_model.layers.{i}.experts.0.up_proj"  # from tensors: model.language_model.layers.0.experts.0.up_proj.weight
down = "model.language_model.layers.{i}.experts.0.down_proj"  # from tensors: model.language_model.layers.0.experts.0.down_proj.weight

[layer.norms]
pre_attn = "model.language_model.layers.{i}.input_layernorm"  # from tensors: model.language_model.layers.0.input_layernorm.weight
pre_ffn = "model.language_model.layers.{i}.pre_feedforward_layernorm"  # from tensors: model.language_model.layers.0.pre_feedforward_layernorm.weight

[top]
embed = "model.language_model.embed_tokens"     # from tensors: model.language_model.embed_tokens.weight
final_norm = "model.language_model.norm"        # from tensors: model.language_model.norm.weight
lm_head = { tensor = "lm_head", tied_to = "model.language_model.embed_tokens" }  # lm_head is absent from the checkpoint and text_config.tie_word_embeddings = true, so it is tied to the embedding table
# ignored (not part of the text decoder): model.vision_tower.* (355)
# TODO(recipe-new): top: 1 checkpoint tensor(s) outside the layer stack are claimed by no block, e.g. ["model.embed_vision.embedding_projection.weight"]; decide whether the model needs them
# TODO(recipe-new): layer: 1542 per-layer tensor(s) are claimed by no block, e.g. ["experts.1.down_proj.input_scale", "experts.1.down_proj.weight", "experts.1.down_proj.weight_scale", "experts.1.down_proj.weight_scale_2", "experts.1.gate_proj.input_scale", "experts.1.gate_proj.weight"] ... (relative to model.language_model.layers.<i>.); extra norms, biases or unknown modules need a block or an explicit decision to ignore them

[defaults]
# TODO(recipe-new): quant: quant_algo "NVFP4" (NVFP4 weights AND 4-bit activations) declared in hf_quant_config.json; the engine implements only weight-only W4A16_NVFP4

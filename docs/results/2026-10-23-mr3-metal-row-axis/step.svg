<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" role="img" aria-labelledby="ttl desc">
<title id="ttl">Batched decode step of Qwen3.6-35B-A3B on Metal, before and after row-table kernels</title>
<desc id="desc">Left: step time per batch size, before (per-row GDN and attention launches) and after (one launch over all rows). Right: launches per step for the four per-row ops at B = 8.</desc>
<style>:root{--bg:#fff;--fg:#1f2328;--mut:#59636e;--b:#8c959f;--a:#1a7f37;--ln:#d0d7de}@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--b:#6e7681;--a:#3fb950;--ln:#30363d}}.bg{fill:var(--bg)}.t{font:600 13px system-ui,sans-serif;fill:var(--fg)}.s{font:11px system-ui,sans-serif;fill:var(--mut)}.h{font:700 14px system-ui,sans-serif;fill:var(--fg)}.bb{fill:var(--b)}.ba{fill:var(--a)}.ax{stroke:var(--ln);stroke-width:1}</style>
<rect class="bg" width="980" height="560"/>
<text x="20" y="28" class="h">Batched decode step, 35B on Metal (in-process, LastArgmax, 24 steps)</text>
<line class="ax" x1="50" x2="500" y1="470.0" y2="470.0"/><text class="s" x="44" y="474.0" text-anchor="end">0</text>
<line class="ax" x1="50" x2="500" y1="370.0" y2="370.0"/><text class="s" x="44" y="374.0" text-anchor="end">10</text>
<line class="ax" x1="50" x2="500" y1="270.0" y2="270.0"/><text class="s" x="44" y="274.0" text-anchor="end">20</text>
<line class="ax" x1="50" x2="500" y1="170.0" y2="170.0"/><text class="s" x="44" y="174.0" text-anchor="end">29</text>
<line class="ax" x1="50" x2="500" y1="70.0" y2="70.0"/><text class="s" x="44" y="74.0" text-anchor="end">39</text>
<text class="s" x="20" y="62">ms per step</text>
<rect class="bb" x="70" y="339.2" width="52" height="130.8" rx="3"/><text class="t" x="96" y="333.2" text-anchor="middle">12.9</text>
<rect class="ba" x="130" y="344.5" width="52" height="125.5" rx="3"/><text class="t" x="156" y="338.5" text-anchor="middle">12.3</text>
<text class="t" x="126" y="490" text-anchor="middle">B = 2</text>
<text class="s" x="126" y="506" text-anchor="middle">156 to 162 tok/s</text>
<rect class="bb" x="220" y="260.6" width="52" height="209.4" rx="3"/><text class="t" x="246" y="254.6" text-anchor="middle">20.6</text>
<rect class="ba" x="280" y="282.6" width="52" height="187.4" rx="3"/><text class="t" x="306" y="276.6" text-anchor="middle">18.4</text>
<text class="t" x="276" y="490" text-anchor="middle">B = 4</text>
<text class="s" x="276" y="506" text-anchor="middle">194 to 217 tok/s</text>
<rect class="bb" x="370" y="106.4" width="52" height="363.6" rx="3"/><text class="t" x="396" y="100.4" text-anchor="middle">35.8</text>
<rect class="ba" x="430" y="162.5" width="52" height="307.5" rx="3"/><text class="t" x="456" y="156.5" text-anchor="middle">30.2</text>
<text class="t" x="426" y="490" text-anchor="middle">B = 8</text>
<text class="s" x="426" y="506" text-anchor="middle">224 to 265 tok/s</text>
<rect class="bb" x="60" y="520" width="12" height="12"/><text class="s" x="78" y="530">main (per-row launches)</text><rect class="ba" x="260" y="520" width="12" height="12"/><text class="s" x="278" y="530">mr3 (row-table kernels)</text>
<text x="540" y="62" class="h">Launches per step at B = 8</text>
<text class="t" x="540" y="90">gdn_delta_rule</text>
<rect class="bb" x="540" y="98" width="380.0" height="16" rx="3"/><text class="s" x="926.0" y="110">240</text>
<rect class="ba" x="540" y="118" width="47.5" height="16" rx="3"/><text class="s" x="593.5" y="130">30</text>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntarsiaML</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/style.css">
<script>
  // Set the theme before first paint: stored choice, else the OS preference, else dark.
  (function () {
    var t = null;
    try { t = localStorage.getItem('intarsia.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M16 3l13 13-13 13L3 16z" fill="var(--accent)"/><path d="M16 10l6 6-6 6-6-6z" fill="var(--bg)"/><path d="M16 13l3 3-3 3-3-3z" fill="var(--warn)"/></svg><span>Intarsia<b>ML</b></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="chat" aria-selected="true">Chat</button>
    <button role="tab" data-tab="dashboard" aria-selected="false">Dashboard</button>
    <button role="tab" data-tab="arch" aria-selected="false">Architecture</button>
  </nav>
  <div class="top-right">
    <span id="conn" class="pill" title="telemetry stream (/events)"><i></i><span>connecting</span></span>
    <span id="model-name" class="mono dim hide-sm"></span>
    <button id="theme" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</header>
<main>
  <section id="view-chat" class="view" data-view="chat"></section>
  <section id="view-dashboard" class="view" data-view="dashboard" hidden></section>
  <section id="view-arch" class="view" data-view="arch" hidden></section>
</main>
<script type="module" src="/ui/app.js"></script>
</body>
</html>

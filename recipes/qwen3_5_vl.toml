# Qwen3.5-family dense hybrid decoder in the vision-language wrapper (Qwen3_5ForConditionalGeneration, e.g. Qwen3.8-27B):
# the same blocks as recipes/qwen3_5.toml (GatedDeltaNet linear attention interleaved with gated full attention per
# config.json text_config.layer_types, zero-centred RMSNorm, partial rotary embeddings, dense SwiGLU FFN), but the text
# weights live under model.language_model.*; the vision tower (model.visual.*) is ignored; the MTP head (mtp.*) loads for --spec mtp ([mtp] below).
# Quantisation (bf16, or AMD Quark MXFP4 W4A4 for amd/Qwen3.8-27B-Quark-AWQ-MXFP4) is detected per tensor and checked
# against config.json quantization_config, not named here.
# Scaffolded by `intarsia recipe new` (0 TODOs) during the M1 onboarding drill (docs/results/2026-10-21-m1-qwen38-drill.md).
[model]
match.architectures = ["Qwen3_5ForConditionalGeneration"]
family = "qwen3_5_vl"
chat_template = "hf"
reasoning_parser = "think-tags"
tool_parser = "hermes"
norm_offset = 1.0        # RMSNorm scale is 1 + weight (not the gated norm inside GatedDeltaNet)

[layer]
pattern = ["attn", "ffn"]              # used only when a layer has no type
pattern_by_layer = "layer_types"       # config.json key

[layer.by_type]
full_attention = ["attn", "ffn"]
linear_attention = ["gdn", "ffn"]

[layer.attn]
kind = "gqa"
gated = true                           # q_proj = [q | output gate] per head
q = "model.language_model.layers.{i}.self_attn.q_proj"
k = "model.language_model.layers.{i}.self_attn.k_proj"
v = "model.language_model.layers.{i}.self_attn.v_proj"
o = "model.language_model.layers.{i}.self_attn.o_proj"
q_norm = "model.language_model.layers.{i}.self_attn.q_norm"
k_norm = "model.language_model.layers.{i}.self_attn.k_norm"
rope = "default"                       # text-only: all three mrope axes carry the same position, i.e. plain rope

[layer.gdn]
kind = "gated_delta_net"
in_qkv = "model.language_model.layers.{i}.linear_attn.in_proj_qkv"
in_z = "model.language_model.layers.{i}.linear_attn.in_proj_z"
in_b = "model.language_model.layers.{i}.linear_attn.in_proj_b"
in_a = "model.language_model.layers.{i}.linear_attn.in_proj_a"
conv = "model.language_model.layers.{i}.linear_attn.conv1d"
a_log = "model.language_model.layers.{i}.linear_attn.A_log"
dt_bias = "model.language_model.layers.{i}.linear_attn.dt_bias"
norm = "model.language_model.layers.{i}.linear_attn.norm"
out = "model.language_model.layers.{i}.linear_attn.out_proj"

[layer.ffn]
kind = "dense"
act = "silu_glu"
gate = "model.language_model.layers.{i}.mlp.gate_proj"
up = "model.language_model.layers.{i}.mlp.up_proj"
down = "model.language_model.layers.{i}.mlp.down_proj"

[layer.norms]
pre_attn = "model.language_model.layers.{i}.input_layernorm"
pre_gdn = "model.language_model.layers.{i}.input_layernorm"
pre_ffn = "model.language_model.layers.{i}.post_attention_layernorm"

[top]
embed = "model.language_model.embed_tokens"
final_norm = "model.language_model.norm"
lm_head = { tensor = "lm_head", tied_to = "model.language_model.embed_tokens" }

[defaults]
kv_dtype = "bf16"
max_batch = 32
# MXFP4 projections (amd/Qwen3.8-27B-Quark-AWQ-MXFP4) run with 16-bit activations (W4A16), not the W4A4 the Quark config declares:
# full MMLU n=1425 W4A16 0.822 vs W4A4 0.802 (Radiance 0.830); cost at tp2: prefill -30% (2121 -> 1479 tok/s at 4k), decode -13..-19%
# (MTP k=2 still works), docs/results/2026-10-27-act27-27b-w4a16-mmlu.md. User decision 2026-10-26 20:24. `--mxfp4-act dynamic`
# runs the declared W4A4. No effect on a bf16 checkpoint of this architecture. HIP overrides this under [tuning.hip] (W4A8).
mxfp4_act = "none"

# Multi-token-prediction head (`mtp.*`, bf16 even in a quantised checkpoint): fc over [norm(embed) | norm(hidden)], one gated
# full-attention + dense SwiGLU layer, a final norm, the model's lm_head. Read only by `--spec mtp`; without that flag
# nothing under `mtp.*` is loaded.

[mtp]

kind = "qwen3_5_mtp"
prefix = "mtp"

# Defaults only where they were measured. The MTP drafter's argmax runs over the first 65536 of the 248320 lm_head rows
# (`--mtp-draft-vocab`; `--mtp-draft-vocab 0` is the full head). Output is unchanged (the verify pass keeps the full head). Measured on
# the Qwen3.8-27B MXFP4 on HIP, k=2: +8 to +12% decode on natural text (acceptance within about 4 points of the full head), Rust code
# +11.6%; Chinese acceptance 65.9% -> 51.4% and 16% slower than the full head (docs/results/2026-10-25-sp-hip-spec.md sections 6 and 8).
# User decision 2026-10-25 11:05. CUDA and Metal are not set here: not measured for the 27B.
[tuning.hip]
mtp_draft_vocab = 65536
# `--spec mtp --spec-k 2` without --spec at in-process tensor parallelism (--tp N, N > 1, one sequence): exact (27B ids 18/18 at tp=2
# vs --spec off, soak 40/40), 1.43-1.93x decode in every category, interleaved x3 (docs/results/2026-10-26-dfh-hip-dflash.md section 14).
# User decision 2026-10-26 11:07: "turn MTP on by default at tp2 if it passes". tp=1 is unchanged. --spec off or INTARSIA_SPEC_DEFAULT=0
# opts out.
mtp_default_tp_k = 2
# MXFP4 projections on HIP run fp8 (e4m3) per-token activations (W4A8), not the [defaults] W4A16: full MMLU n=1425 0.8204 (W4A16 0.822,
# W4A4 0.802, within 0.2 SE of W4A16); against W4A16 at tp2 with MTP k2: prefill +48% (1432 -> 2122 tok/s at 4k), decode +11% (all category
# rows, median 81.0 -> 90.2 tok/s); KL to the W4A16 golden 12x below W4A4's; MTP ids 18/18 at tp2.
# docs/results/2026-10-27-w4a8-hip-fp8-act.md. User decision 2026-10-26 20:24 (option 2). CUDA and Metal have no W4A8 kernels and keep the
# [defaults] W4A16. `--mxfp4-act none` runs W4A16 on HIP, `dynamic` the declared W4A4.
mxfp4_act = "fp8"
# Prefill chunk 2048 rows (builtin default 256): at tp2 a 4k prefill is 16 chunks of 256 rows, each paying every launch, the small-M GEMM tiles and
# the weight read again; 2048 is 2 chunks. 3858-token prompt, tp2, W4A8, interleaved: prefill 1724 -> 1258 ms (+37 %); every row-wise kernel is
# row-independent (the a8 GEMM bitwise for M 1..4100) and the recurrence carries its state, so the ids are unchanged. 4096 (+33 %) and 1024 (+32 %)
# are slower on this prompt. docs/results/2026-10-27-h27p-hip-27b-prefill.md. `--prefill-chunk N` overrides.
prefill_chunk = 2048
# Tail peel 16: a prompt whose length mod 256 is 1..16 ends in a pass of that many rows; chunk 256 runs it on the small-M row kernels
# (rows_exact, M <= 16), a 2048 chunk would run the same rows inside the last big pass on the GEMM tiles, and one prompt in 18 of the ids
# gate (16k-3, 6 tail rows) then flipped a token at position 88. The peel cuts those last rows off as their own pass, so the schedule of
# the tail is the 256 one (the lane mx mechanism, docs/results/2026-10-25-mx-hip-27b-prefill.md section 4).
prefill_peel = 16
# Busy chunk 256: under `serve --max-batch` > 1 a prompt that arrives while other streams decode prefills in 256-row chunks (the loader's rule would
# take the model chunk, 2048). A 2048-row chunk stalls the decoding streams for 650 ms (max inter-token gap, 4k prompt arriving beside one stream), 256 rows
# for 135 ms, the base build's number. Alone, a prompt still prefills in 2048-row chunks.
busy_chunk = 256
# bf16 all-reduce partials at tensor parallelism (the row-parallel o / down / gdn-out projections reduce bf16 partials in place, 2 B per element
# instead of the f32 partial's 4 B): the 4k prefill all-reduce is 35 % of the pass on the 2 x R9700 PCIe link (28 GB/s). Prefill +17 / +18 / +17 %
# (1k / 4k / 16k, 6 interleaved rounds, MTP k2). Gates (docs/results/2026-10-27-tpb-hip-tp-partials.md): MMLU n=1425 0.8218 (f32 partials 0.8204;
# paired 13 vs 15 questions), KL to the W4A16 golden x1.06 (prefill) / x1.24 (decode) of the f32 partials', MTP spec-on == spec-off texts 18/18,
# batched == solo, decode level (spec-off x1.002 / x1.001). The greedy ids differ from the f32 partials' on most prompts (rounding changes which
# near-tie token wins), so this is an accuracy-neutral change, not a bitwise one. `INTARSIA_TP_PARTIAL=f32` opts out.
tp_partial = "bf16"

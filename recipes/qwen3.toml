# Qwen3 dense decoder (Qwen3ForCausalLM): GQA + per-head qk-norm + SwiGLU FFN.
# Tensor name templates use {i} for the layer index; ".weight" is appended when the
# bare name is not a tensor. Dimensions (heads, head_dim, eps, rope theta, tied
# embeddings, vocab) are read from config.json.

[model]
match.architectures = ["Qwen3ForCausalLM"]
family = "qwen3"
chat_template = "hf"            # the model's own jinja template via minijinja
reasoning_parser = "think-tags"
tool_parser = "hermes"

[layer]
pattern = ["attn", "ffn"]       # blocks applied in order inside every layer

[layer.attn]
kind = "gqa"
q = "model.layers.{i}.self_attn.q_proj"
k = "model.layers.{i}.self_attn.k_proj"
v = "model.layers.{i}.self_attn.v_proj"
o = "model.layers.{i}.self_attn.o_proj"
q_norm = "model.layers.{i}.self_attn.q_norm"
k_norm = "model.layers.{i}.self_attn.k_norm"
rope = "default"                # neox / rotate-half, theta = rope_theta

[layer.ffn]
kind = "dense"
act = "silu_glu"
gate = "model.layers.{i}.mlp.gate_proj"
up = "model.layers.{i}.mlp.up_proj"
down = "model.layers.{i}.mlp.down_proj"

[layer.norms]
pre_attn = "model.layers.{i}.input_layernorm"
pre_ffn = "model.layers.{i}.post_attention_layernorm"

[top]
embed = "model.embed_tokens"
final_norm = "model.norm"
lm_head = { tensor = "lm_head", tied_to = "model.embed_tokens" }

[defaults]
# Phase 0 CPU/CUDA support bf16 KV. fp8_e4m3 KV is accepted by the cpu oracle and the registry
# but not yet by the GPU kernels.
kv_dtype = "bf16"
# Most sequences `--max-batch` may decode together (continuous batching, Metal only, exact kernels: 8 rows). Batching
# is opt-in: without `--max-batch` the engine serves one sequence at a time.
max_batch = 8

# Prefill chunk per backend (an explicit --prefill-chunk wins; unlisted backends use 256, so CUDA/HIP/CPU are unchanged).
# 2048 on Metal: plain prefill on Qwen3-8B BF16 / M5 Max goes 459 -> 386 ms at 1k (973 tokens), 1725 -> 1448 ms at 4k
# (4062 tokens), 12998 -> 12532 ms at 16k (medians of 3), for about +220 MiB peak process footprint at max-seq 18432; 1024
# is within noise of 2048 at 1k and 4k (docs/results/2026-10-14-metal-prefill-p3-final.md). The chunk is part of the
# accuracy baseline identity: golden/baselines/qwen3-8b*.metal.*.json were recorded with it. Known gap: the 8B long
# golden's longest prompt is 700 tokens, so `qualify`'s prefix-reuse gate (needs a split >= one chunk) is skipped, and a
# skip is not a pass, at any chunk above 350; a long golden with 4k prompts is needed (same document).
[tuning.metal]
prefill_chunk = 2048

# 2048 on HIP (R9700, Qwen3-8B BF16): prefill at 1k / 4k goes 3416 / 3124 tok/s (256) to 4444 / 3993 (2048); 4096 is 4412 / 4041,
# within 1.2 % of 2048. Same known gap as Metal for `qualify`'s prefix-reuse gate on the 700-token long golden
# (docs/results/2026-10-17-hip-prefill.md).
[tuning.hip]
prefill_chunk = 2048

# `intarsia accuracy` only. chat_turns: the KL floor skips the system and user turns of chat prompts (ChatML). The reuse
# tolerances are the fixed rounding scale of the prefix-reuse judge, measured once on Qwen3-8B / HIP, where decode-written
# and prefill-written KV rows move the top-5 log-probabilities by up to 0.15 nats and KL(cold || warm) by <= 3.3e-3
# (docs/results/2026-10-13-prefix-reuse.md). They are constants of this model, not derived per run.
[accuracy]
chat_turns = "chatml"
reuse_logit_tol = 0.25
reuse_kl_tol = 1e-2

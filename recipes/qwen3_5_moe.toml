# Qwen3.5 / Qwen3.6 hybrid MoE (Qwen3_5MoeForConditionalGeneration, e.g. Qwen3.6-35B-A3B): GatedDeltaNet layers and
# gated full-attention layers interleaved by config.json text_config.layer_types (3x linear_attention, then 1x
# full_attention), zero-centred RMSNorm, partial rotary (0.25 of head_dim), sparse MoE FFN with a gated shared expert.
# Text weights live under model.language_model.*; the vision tower and the MTP head are ignored.
# Quantisation (FP8 projections, NVFP4 routed experts) is detected per tensor from the checkpoint, not named here.
[model]
match.architectures = ["Qwen3_5MoeForConditionalGeneration", "Qwen3_5MoeForCausalLM"]
family = "qwen3_5_moe"
chat_template = "hf"
reasoning_parser = "think-tags"
tool_parser = "hermes"
norm_offset = 1.0        # RMSNorm scale is 1 + weight (not the gated norm inside GatedDeltaNet)

[layer]
pattern = ["attn", "moe"]              # only used for a layer without a type
pattern_by_layer = "layer_types"       # config.json key

[layer.by_type]
full_attention = ["attn", "moe"]
linear_attention = ["gdn", "moe"]

[layer.attn]
kind = "gqa"
gated = true                           # q_proj = [q | output gate] per head
q = "model.language_model.layers.{i}.self_attn.q_proj"
k = "model.language_model.layers.{i}.self_attn.k_proj"
v = "model.language_model.layers.{i}.self_attn.v_proj"
o = "model.language_model.layers.{i}.self_attn.o_proj"
q_norm = "model.language_model.layers.{i}.self_attn.q_norm"
k_norm = "model.language_model.layers.{i}.self_attn.k_norm"
rope = "default"                       # text-only: all three mrope axes carry the same position, i.e. plain rope

[layer.gdn]
kind = "gated_delta_net"
in_qkv = "model.language_model.layers.{i}.linear_attn.in_proj_qkv"
in_z = "model.language_model.layers.{i}.linear_attn.in_proj_z"
in_b = "model.language_model.layers.{i}.linear_attn.in_proj_b"
in_a = "model.language_model.layers.{i}.linear_attn.in_proj_a"
conv = "model.language_model.layers.{i}.linear_attn.conv1d"
a_log = "model.language_model.layers.{i}.linear_attn.A_log"
dt_bias = "model.language_model.layers.{i}.linear_attn.dt_bias"
norm = "model.language_model.layers.{i}.linear_attn.norm"
out = "model.language_model.layers.{i}.linear_attn.out_proj"

# The sparse MoE block (router + routed experts + gated shared expert) is built by the quantmoe code
# (intarsia_core::quant::moe) from this module prefix.
[layer.moe]
kind = "qwen3_5_moe"
prefix = "model.language_model.layers.{i}.mlp"

[layer.norms]
pre_attn = "model.language_model.layers.{i}.input_layernorm"
pre_gdn = "model.language_model.layers.{i}.input_layernorm"
pre_moe = "model.language_model.layers.{i}.post_attention_layernorm"

[top]
embed = "model.language_model.embed_tokens"
final_norm = "model.language_model.norm"
lm_head = { tensor = "lm_head", tied_to = "model.language_model.embed_tokens" }

[defaults]
kv_dtype = "bf16"
max_batch = 32

# Prefill chunk per backend (an explicit --prefill-chunk wins; unlisted backends use 256). 2048 on CUDA: 35B prefill at
# 4k goes from 2397 to 4654 tok/s, the 35b-short accuracy gate passes (prefill KL 5.43e-3 vs 6.27e-3) and 35b-long
# fails only on chat_reuse_4k, which is chunk-sensitive (docs/results/2026-10-13-prefill-cuda.md, phase1b.md section 9).
# Not on HIP: a 2048 chunk may not fit the 35B in one 32 GB R9700 and has not been measured there.
[tuning.cuda]
prefill_chunk = 2048

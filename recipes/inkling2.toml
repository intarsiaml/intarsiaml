# Thinking Machines Inkling-2-Mini (Inkling2LoopForConditionalGeneration, model_type inkling2_loop): the TEXT model only (vision
# tower and the MTP / DSpark speculator are not loaded). 24 physical layers run as 48 visits (prelude 0..6, the core 6..18 three
# times with cross-pass controllers, coda 18..24); depth mixing over attn-res blocks of 6 layers instead of a residual stream;
# SWA (window 1024) and full attention layers with a distance bias, a per-query sink, short convs on K / V and on both sublayer
# outputs; 128 routed experts (top-8, sigmoid + bias, SiTU) in NVFP4, MXFP8 on layers 20 and 23. Port spec:
# docs/plans/2026-11-21-inkling2-port.md; the layer is one `ink` block (crates/intarsia-core/src/model/inkling2.rs) whose
# visit table, state slots and loader are fixed by config.json (lane ink-skel, docs/results/2026-11-21-inkling2-skel.md).
[model]
match.architectures = ["Inkling2LoopForConditionalGeneration"]
family = "inkling2"
chat_template = "hf"            # chat_template.jinja (spec section e: no generation prompt, the model opens its own turn). The server renders chats
                                # through the codec's own Inkling renderer instead (vLLM's, crates/intarsia-models/src/inkling_chat.rs); the template
                                # stays the reference (tools/inkling2_chat_ref.py) and serves `intarsia generate`.
reasoning_parser = "inkling"    # blocks by token id: `<|content_thinking|>` -> reasoning_content (crates/intarsia-server/src/inkling.rs)
tool_parser = "inkling"         # `<|content_invoke_tool_json|>{"name":..,"args":{..}}`; required / named tool_choice are instructions, not grammars (as vLLM)

[layer]
pattern = ["ink"]

[layer.ink]
kind = "inkling2"
prefix = "model.llm.layers.{i}"   # the checkpoint's `model.llm.` prefix (vision under `model.vision.`, MTP in mtp.safetensors)
root = "model.llm"                # attn_res queries, cross-pass queries, embed_norm

[top]
embed = "model.llm.embed"         # [vocab_size (padded), D]; the model uses the first unpadded_vocab_size rows
final_norm = "model.llm.norm"
lm_head = { tensor = "model.llm.unembed" }   # bf16, not tied; logits = 30 tanh(x / 30) over the 200058 real tokens

[defaults]
kv_dtype = "bf16"
max_batch = 16                  # the cap of --max-batch (batched decode, lane ink-batch); without the flag one sequence at a time

# 2048 on CUDA (GB10 spark2, coordinator-approved 2026-11-22): 4k prefill goes 1123 -> 2138 tok/s vs the default 256, same
# 64-token greedy ids, G2 short / long and G3 4k pass, peak RSS unchanged (docs/results/2026-11-21-inkling2-cuda-mixmoe.md,
# "Prefill chunk sweep"). Revert: `--prefill-chunk 256`, or delete this section.
[tuning.cuda]
prefill_chunk = 2048
# DSpark speculation by default on CUDA (brief 32, user decision 5, 2026-11-22): without --spec, one sequence at one rank runs
# --spec dflash with the model's own draft (mtp.safetensors) at k3, the DSpark gate at its code default; greedy output is
# --spec off's, sampled requests take plain steps (unless INTARSIA_SPEC_SAMPLED_DFLASH=1, opt-in, lane ink-sampled), a batching
# server has no draft (docs/results/2026-11-21-inkling2-cuda-attn.md).
# Revert: --spec off, INTARSIA_SPEC_DEFAULT=0, or delete this line.
mtp_default_k = 3

# 2048 on Metal (endor M5 Max; lane ink-prefill, coordinator brief 8 / 2026-11-22): serve prefill at 1k / 4k / 16k goes from
# ~1300 / ~1430 / ~1470 tok/s (the 256 fallback) to ~2140 / ~2310 / ~2490, G2 / G3 pass at 2048
# (docs/results/2026-11-21-inkling2-prefill.md, fleetq #11109). Unlisted backends keep 256.
[tuning.metal]
prefill_chunk = 2048
# The chunk a prompt prefills in beside decoding streams (`serve --max-batch` > 1) is 2048 too, not the builtin 256 (user decision
# 2026-11-25; docs/results/2026-11-25-ink-busy2048.md): at 16 streams the aggregate goes up by about +25 % (two A/Bs, fully warm arms: 142 -> 177 tok/s,
# worst case +15 %), a queued prompt starts decoding sooner (TTFT p99 ~10 s -> ~5 s), at the price of the decoding rows' ITL p99
# (0.24 s -> 0.43-0.71 s: a 2048-row pass is ~0.9 s). A lone prompt always runs the solo chunk.
# Revert: `--busy-chunk 256`, or delete this line.
busy_chunk = 2048
# the device sampler (Gumbel-max on the GPU) for plain-temperature requests: same distribution, other tokens for a given seed,
# sampled decode about 11-12 % faster (user decision 2026-11-22; docs/results/2026-11-21-inkling2-hostgap.md).
# INTARSIA_GUMBEL_SAMPLING=0 reverts.
gumbel_sampling = true
# speculation with the checkpoint's own DSpark draft (mtp.safetensors) at k 3, cumulative cut 0.5 (was the per-step gate 0.8 until
# lane ink-spec-cut, 2026-11-26; INTARSIA_DSPARK_TAU=0.8 restores it), for greedy requests at one sequence (sampled ones too with the
# opt-in INTARSIA_SPEC_SAMPLED_DFLASH=1, docs/results/2026-11-26-inkling2-sampled-dspark.md)
# (no --max-batch above 1, no prefix store): decode 1.12-1.28x at 141 / 1k / 4k / 16k prompt tokens, prefill within 0.5 %
# (docs/results/2026-11-21-inkling2-mtp.md; user decision 5, 2026-11-22). The same key as CUDA's above: without [mtp], an Inkling-2
# recipe's mtp_default_k is its DSpark draft's default. --spec off, INTARSIA_SPEC_DEFAULT=0, or delete this line turns it off.
mtp_default_k = 3
# Draft length of sampled requests that draft (INTARSIA_SPEC_SAMPLED_DFLASH=1, opt-in): lane ink-sampled-adapt, 2026-11-26: the measured Metal
# table and the grid's best on one traced seed-11 run. It did NOT pass the gate on endor (story prompt 0.94 of plain sampling, T 0.7 1k / 4k below 98 % of
# fixed k3's gain; docs/results/2026-11-26-inkling2-sampled-adapt.md), so sampled drafting stays opt-in and not recommended on Metal.
# Revert: INTARSIA_SPEC_SAMPLED_ADAPT=0 (fixed k3), or delete this line (the built-in table).
sampled_adapt = "d=0.237,r=0.236/0.418/0.583,g=0.85,margin=0.0,drop=0.0,probe=3,hold=8,hold_max=32"

# 2048 on HIP (R9700, tatooine; user decision 2026-11-26 "Yes, flip it", with the tensor-core expert prefill and the flash prefill
# attention, which are code defaults now: INTARSIA_HIP_INK_MOE_WMMA / INTARSIA_HIP_INK_ATTN_FLASH, unset = on): prefill on one R9700 at
# 4k / 16k goes from 652 / 579 tok/s (the old default, chunk 2048) to 2687 / 2793 (614 at the 256 fallback), G2 short / long
# 21-way KL <= 4.5e-3 (limit 3e-2); greedy text is no longer the old default's (docs/results/2026-11-25-inkling2-hip-moe.md,
# docs/results/2026-11-25-inkling2-hip-attn.md, docs/results/2026-11-26-inkling2-hip-pfflip.md). No `busy_chunk` here: batching is
# refused for Inkling-2 on HIP (no row-table kernels), so a prompt never prefills beside decoding streams.
# Revert: `--prefill-chunk 256` with INTARSIA_HIP_INK_MOE_WMMA=0 INTARSIA_HIP_INK_ATTN_FLASH=0 (the old default), or delete this section.
[tuning.hip]
prefill_chunk = 2048
# DSpark speculation by default on HIP (lane ink-hip-spec, 2026-11-26; the brief's bar: on >= off at every length and >= +2 % with a
# CI lower bound above 1.0 at more than one): without --spec, one sequence at one rank runs --spec dflash with the model's own draft
# (mtp.safetensors) at k3 (k5 since lane ink-hip-verify, below) and Metal's rule, the cumulative cut 0.5 with no per-step gate (`cut_rule_default` in
# crates/intarsia-core/src/model/dspark.rs; INTARSIA_DSPARK_TAU=0.8 restores the gate). Greedy decode on one R9700 at the short /
# 1k / 4k / 16k prompts: 1.34 / 1.19 / 1.55 / 1.31x (the gate 0.8: 1.32 / 1.16 / 1.46 / 1.29x; 4 + 4 processes, 95 % CI lower bounds
# 1.34 / 1.19 / 1.55 / 1.31), prefill within 0.7 %, ids identical to --spec off; sampled requests take plain steps (unless
# INTARSIA_SPEC_SAMPLED_DFLASH=1, opt-in: docs/results/2026-11-26-inkling2-sampled-dspark.md), a batching server has no draft
# (docs/results/2026-11-26-inkling2-hip-spec.md). Revert: --spec off, INTARSIA_SPEC_DEFAULT=0, or delete this line.
# k5 since lane ink-hip-verify (2026-11-26; the coordinator's rule: no length slower than k3 beyond its CI, >= +2 % with a CI lower
# bound above 1.0 at >= 2 lengths, then the higher geometric mean): a verify row costs ~2.3 ms against a 13.4 ms step on HIP, so longer
# drafts pay for their rows. Spec-default decode on main 80719483a, k / k3 at short / 1k / 4k / 16k (4 + 4 processes): k5 1.007 / 1.009
# / 1.080 / 1.050 (CI lower bounds 1.006 / 1.008 / 1.079 / 1.049, geomean 1.036); k4 1.018 / 1.001 / 1.059 / 1.035 (geomean 1.028);
# ids identical to k3 and --spec off (docs/results/2026-11-26-inkling2-hip-verify.md). Revert to k3: set 3 here (or --spec-k 3).
mtp_default_k = 5
# Draft length of sampled requests that draft (INTARSIA_SPEC_SAMPLED_DFLASH=1, opt-in; nothing changes without it): lane ink-sampled-adapt,
# 2026-11-26. The measured cost table (the 15 % rule, 4 of 6 rows measured) and the parameters the offline replay picked on W1's seed-11
# traces. On the R9700, sampled speed on / off, T 1.0 and 0.7 (3 reps): short 1.172 / 1.163 (fixed k5 1.101 / 1.143), 1k 1.042 / 1.068, 4k 1.466 / 1.458,
# the story prompt 0.981 / 0.991 (fixed k5 0.896 / 0.982); docs/results/2026-11-26-inkling2-sampled-adapt.md.
# Revert: INTARSIA_SPEC_SAMPLED_ADAPT=0 (fixed k5), or delete this line (the built-in table).
sampled_adapt = "d=0.234,r=0.273/0.498/0.69/0.985/1.211,g=0.95,margin=0.0,drop=0.05,probe=1,hold=16,hold_max=64"
# Sampled requests (temperature > 0) draft with the DSpark draft by default on HIP (lane ink-hip-specflip, user decision 2026-11-26 "Both,
# confirm first"), with the draft length policy above: seeded ids equal to --spec off (the keyed Match rule), the story prompt 0.981 of plain
# sampling (docs/results/2026-11-26-inkling2-sampled-adapt.md, docs/results/2026-11-26-inkling2-hip-specflip.md). Only with the model's own
# draft (the DSpark default or --spec-draft <model dir>), one sequence; a batching server has no draft. Metal failed the gate: opt-in there.
# Revert: INTARSIA_SPEC_SAMPLED_DFLASH=0, or delete this line.
sampled_dflash = true
# Flip B (lane ink-hip-specflip; user decisions 2026-11-26 "Both, confirm first", option (a) per the coordinator 2026-11-27 00:08): the
# DFlash2 drafter (Inkling-2-Mini-DFlash2) loads beside the DSpark draft of the default above when it is found next to the checkpoint
# (<checkpoint>/../Inkling-2-Mini-DFlash2, or an absolute path here). Greedy requests draft with it at k4 (1.112x DSpark k5 over the six
# cells, 4k 0.991 [0.987-0.994], both cards, docs/results/2026-11-26-inkling2-dflash2.md and -hip-specflip.md); sampled requests keep the
# DSpark draft (sampled_dflash; sampled DFlash2 failed its gate). Both drafts are loaded; each sequence keeps one draft state active.
# Not found: the DSpark default alone, never an error. Revert: INTARSIA_SPEC_DFLASH2_DEFAULT=0, or delete these lines.
dflash2_draft = "Inkling-2-Mini-DFlash2"
dflash2_k = 4

[accuracy]
chat_turns = "inkling2"       # one open token per role, <|end_message|> closes (crates/intarsia-cli/src/cmd/accuracy/turns.rs)

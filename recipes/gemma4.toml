# Gemma 4 text decoder with a dense GeGLU MLP and a 128-expert top-8 MoE in parallel (Gemma4ForConditionalGeneration, e.g.
# nvidia/Gemma-4-26B-A4B-NVFP4). Written by hand from transformers 5.6.2 `modeling_gemma4.py` and the checkpoint's config.json
# (lane g4, docs/results/2026-10-22-g4-gemma4-onboard.md): every layer is ONE block, `gemma` (model/gemma.rs), because the layer is
# not attention-then-FFN with pre-norms: it has sandwich norms, a parallel MLP + MoE, a per-layer scalar and per-layer-type
# attention (sliding window 1024, head_dim 256, 8 KV heads / global, head_dim 512, 2 KV heads, K = V, proportional RoPE), all
# derived from config.json layer_types and text_config (ModelDims::gemma). Text weights live under model.language_model.*; the
# vision tower is ignored. Only the experts are NVFP4 (attention, MLP, router, embeddings are bf16); it runs weight-only
# (W4A16) although hf_quant_config.json declares W4A4 (docs/decisions/LOG.md 2026-10-22).
[model]
match.architectures = ["Gemma4ForConditionalGeneration", "Gemma4ForCausalLM"]
family = "gemma4"
chat_template = "hf"
norm_offset = 0.0        # Gemma4RMSNorm scales by `weight` (not 1 + weight)

[layer]
pattern = ["gemma"]

[layer.gemma]
kind = "gemma4"
prefix = "model.language_model.layers.{i}"

[layer.norms]
pre_gemma = "model.language_model.layers.{i}.input_layernorm"

[top]
embed = "model.language_model.embed_tokens"
final_norm = "model.language_model.norm"
lm_head = { tensor = "lm_head", tied_to = "model.language_model.embed_tokens" }

[defaults]
kv_dtype = "bf16"
max_batch = 1
w4a4_as_w4a16 = true   # the checkpoint declares NVFP4 W4A4; the experts run weight-only (docs/decisions/LOG.md 2026-10-22)

[tuning.cuda]
prefill_chunk = 1024

# `intarsia accuracy` only (docs/recipes.md "[accuracy]"). Three opt-in keys for this model, each recipe-scoped so no other model's
# verdict changes (lane g4g, docs/results/2026-10-22-g4g-gemma4-gates.md, docs/decisions/LOG.md 2026-10-22 "Gemma-4 gates").
[accuracy]
# Quick gate in chat form: tools/prompts/ppl_chat.json through this model's own chat template, perplexity over the assistant tokens,
# sanity prompts as user turns. The raw-text gate cannot be met by this instruction-only model (HF bf16 520, vLLM 402, engine 533).
ppl_form = "chat"
# Chat-form perplexity on the same 320 assistant tokens, measured 2026-10-22: HF transformers bf16 35.14 (tools/chat_ppl.py hf),
# engine 35.97 (`accuracy --quick`), so 2.4% apart; vLLM: see the results doc. 60 = 1.7x the reference; a wrong forward is far above it.
max_ppl = 60.0
# Factor on the measured reference noise of the HF bf16 golden (golden/ref_noise/gemma4-26b-a4b-nvfp4-hfbf16.safetensors.json: HF bf16
# vs HF f32 on the same prompts, KL21 2.227e-1). The engine sits at 1.33x (prefill) and 1.50x (decode) of it: bf16 MoE router top-8
# flips. 1.6 = the largest measured ratio plus about 6%. Applies only when that record exists for the golden in use.
ref_noise_factor = 1.6

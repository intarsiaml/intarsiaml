[package]
name = "intarsia-cli"
description = "The `intarsia` command line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "intarsia_cli"
path = "src/lib.rs"

[[bin]]
name = "intarsia"
path = "src/main.rs"

[features]
# `tui` (terminal UI: `intarsia tui`) is on by default; `--no-default-features` builds without it.
default = ["tui"]
tui = ["dep:intarsia-tui"]
# CUDA backend (needs nvcc; off by default so the Mac builds).
cuda = ["dep:intarsia-backend-cuda"]
# HIP backend for AMD gfx12 (needs hipcc / ROCm; off by default). Exclusive with `cuda`: both kernel libraries
# export the same `ik_*` C symbols, so one binary links only one of them (compile_error! in lib.rs).
hip = ["dep:intarsia-backend-hip"]
# Metal backend for Apple GPUs (macOS only: the dependency is target-gated, so the feature is a no-op elsewhere; needs the
# Xcode Metal toolchain at build time). Combinable with cpu; independent of the cuda / hip symbol exclusion.
metal = ["dep:intarsia-backend-metal"]
# Test-only fault injection into the continuous-batching engine (INTARSIA_FAULT_INJECT, intarsia-core/src/fault.rs); with `metal`
# also the Metal synchronize hook. Off by default: a normal build carries no hook.
fault-inject = ["intarsia-core/fault-inject", "intarsia-backend-metal?/fault-inject"]

# Agents: add the dependencies your command module needs at the end of this
# section (append only; keep the lines above untouched).
[dependencies]
intarsia-core = { workspace = true }
intarsia-backend-cpu = { workspace = true }
intarsia-backend-cuda = { workspace = true, optional = true }
intarsia-backend-hip = { workspace = true, optional = true }
intarsia-models = { workspace = true }
intarsia-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# --- agent-owned dependencies: append below this line ---
intarsia-bench = { workspace = true }
sysinfo = { workspace = true }
half = { workspace = true }
ureq = { workspace = true }
libc = { workspace = true }
intarsia-tui = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
intarsia-backend-metal = { workspace = true, optional = true }

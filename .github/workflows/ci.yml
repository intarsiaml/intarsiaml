# CI for the Rust workspace. Runs only on GitHub-hosted runners: no job here touches fleet hardware (spark1, spark2,
# tatooine, endor), and none needs a GPU. The CUDA and HIP crates build their stub kernels (no nvcc / hipcc on the
# runners), so CI checks that the workspace compiles and the CPU-side tests pass. GPU gates stay on the fleet, under fleetq
# (see docs/reproducing-results.md). Dependencies are locked: a Cargo.lock that is out of date fails the build.
#
# fmt and clippy are not run: the tree is not clean for either yet (`cargo fmt --check` reports ~750 diffs), and CI
# does not mass-reformat. Add them as their own PR that reformats first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: cargo check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --locked

  test:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # intarsia-backend-metal is macOS-only (Metal framework). The cuda / hip crates run their CPU-side tests here;
      # their GPU tests skip without a device (INTARSIA_REQUIRE_GPU is unset).
      - run: cargo test --workspace --locked --exclude intarsia-backend-metal

  check-metal:
    name: cargo check (macOS, metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Check only: the runner has no Metal GPU to test on, and without the Xcode Metal toolchain build.rs writes an
      # empty metallib and warns.
      - run: cargo check --locked -p intarsia-backend-metal
      - run: cargo check --locked -p intarsia-cli --features metal

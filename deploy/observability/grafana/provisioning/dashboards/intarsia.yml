# Grafana file provisioning for the dashboard. Mount dashboards/intarsia.json at /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: intarsia
    folder: IntarsiaML
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
